[package]
name = "keymacros"
version = "0.1.0"
edition = "2021"
description = "Bandeja + editor de macros sobre o kanata (Windows)"

[[bin]]
name = "keymacros"
path = "src/main.rs"

[dependencies]
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Shutdown",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
]

[profile.release]
opt-level = "s"
# build rápido (o launcher recompila a cada mudança); RAM praticamente igual
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = true

[workspace]
exclude = ["launcher"]
