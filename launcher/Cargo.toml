[package]
name = "keymacros-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "KeyMacros"
path = "main.rs"

[dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading"]

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
